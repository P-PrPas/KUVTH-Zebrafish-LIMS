[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kuvth-zebrafish-lims"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.136.0",
  "pydantic==2.13.2",
  "SQLAlchemy==2.0.49",
  "uvicorn==0.44.0",
  "psycopg[binary]==3.3.4",
  "PyMySQL==1.2.0",
  "openpyxl==3.1.5",
  "python-multipart==0.0.26",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "PyYAML==6.0.2",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

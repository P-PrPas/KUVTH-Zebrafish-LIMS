        '404': { $ref: '#/components/responses/NotFound' }

  /batches/{id}/duplicate:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    post:
      tags: [Experiments]
      summary: Create a new batch by copying this one
      description: Copies everything except dates and times (FR-305) — enucleation settings repeat almost every run.
      operationId: duplicateBatch
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experimentDate]
              properties:
                experimentDate: { type: string, format: date }
                dayNo: { type: [integer, 'null'] }
                copyInjectionLots:
                  type: boolean
                  default: false
                  description: Copy lot settings without embryos or activation times.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }

  /batches/{id}/injection-lots:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    post:
      tags: [Experiments]
      summary: Add an injection lot and generate its embryos
      description: |
        Creates the lot and immediately generates `nActivated` embryo records
        (FR-308) with codes `{batchCode}_{lotNo}_{seq}` starting at 1. The
        server assigns the next numeric `lotNo` across batches sharing the same
        Code of Egg or clutch code and date. If neither is linked, numbering is
        scoped to the batch. Numbering starts at 1 for each scope/date
        and cannot be entered or changed by the caller. Copied lot templates are
        assigned a number within the destination experiment/date and keep it when activated.

        `activatedAt` is mandatory (FR-307): it is T0 for every downstream
        calculation and for the fish date of birth (BR-01, BR-10).
      operationId: createInjectionLot
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InjectionLotInput' }
      responses:
        '201':
          description: Lot created with its embryos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InjectionLotDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /injection-lots/{id}:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    patch:
      tags: [Experiments]
      summary: Activate a lot template copied with a batch
      description: |
        Supplies T0 and creates the embryos for a draft lot created by
        `duplicateBatch`. An activated lot cannot be changed through this
        operation because changing T0 would invalidate downstream results.
      operationId: activateInjectionLotTemplate
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InjectionLotActivationInput' }
      responses:
        '200':
          description: Template activated and embryos created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InjectionLotDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /injection-lots/{id}/embryos:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    get:
      tags: [Experiments]
      summary: List the embryos of a lot
      operationId: listLotEmbryos
      parameters:
        - name: aliveOnly
          in: query
          description: Only embryos with no exit event yet (FR-405)
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Embryos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Embryo' }
    post:
      tags: [Experiments]
      summary: Add extra embryos to a lot
      description: For when the real count differs from what was entered initially (FR-310).
      operationId: addLotEmbryos
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 96 }
      responses:
        '201':
          description: Embryos added
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Embryo' }

  /embryos/{id}:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    patch:
      tags: [Experiments]
      summary: Update an embryo
      operationId: updateEmbryo
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wellPosition:
                  type: [string, 'null']
                  pattern: '^[A-H](1[0-2]|[1-9])$'
                  examples: ['B3']
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Embryo' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Experiments]
      summary: Soft-delete an embryo
      description: Sets `deletedAt`; nothing is ever physically removed (CON-08, BR-20).
      operationId: deleteEmbryo
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      responses:
        '204': { description: Soft-deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /batches/{id}/control-arm-counts:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    get:
      tags: [Experiments]
      summary: List aggregate counts for the natural-breeding and IVF arms
      operationId: listControlArmCounts
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ControlArmCount' }
    put:
      tags: [Experiments]
      summary: Set aggregate counts for the natural-breeding and IVF arms
      description: |
        These arms are counted in bulk rather than tracked per embryo (FR-703,
        Q6), matching how the lab already records them. Sending a row for an
        existing (armType, stageCode) pair replaces it.
      operationId: putControlArmCounts
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [armType, stageCode, nNormal, nAbnormal]
                    properties:
                      armType: { $ref: '#/components/schemas/ControlArmType' }
                      stageCode: { type: string, examples: ['stage_19_SH'] }
                      nNormal: { type: integer, minimum: 0 }
                      nAbnormal: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ControlArmCount' }

  # -------------------------------------------------------------- observations
  /due-checkpoints:
    get:
      tags: [Observations]
      summary: What needs looking at right now
      description: |
        The home screen (FR-401). Returns every (injection lot × checkpoint) that
        is due but not yet recorded, most overdue first, computed per BR-22:
        `dueAt = activatedAt + expectedHpa`.

        Also returns the next not-yet-due checkpoint per lot so the technician
        can see what is coming, and the count of embryos waiting to be promoted
        (FR-404).
      operationId: listDueCheckpoints
      parameters:
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: operatorId, in: query, schema: { type: string, format: uuid } }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: experimentGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: treatmentGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: donorCellLineId, in: query, schema: { type: string, format: uuid } }
        - { name: strain, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Work queue
          content:
            application/json:
              schema:
                type: object
                required: [overdue, upcoming, pendingPromotionCount]
                properties:
                  overdue:
                    type: array
                    items: { $ref: '#/components/schemas/DueCheckpoint' }
                  upcoming:
                    type: array
                    items: { $ref: '#/components/schemas/DueCheckpoint' }
                  pendingPromotionCount: { type: integer, minimum: 0 }

  /injection-lots/{id}/checkpoints/{stageCode}:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - name: stageCode
        in: path
        required: true
        schema: { type: string }
        examples: { default: { value: stage_09_256C } }
    get:
      tags: [Observations]
      summary: Everything the checkpoint entry screen needs
      description: |
        Returns observable embryos plus embryos previously recorded DEAD or
        DEGENERATED. Terminal embryos carry `isDead: true` so their original
        plate wells remain visible as read-only dead wells in every later round;
        they are excluded from `embryosRemaining` and new observations. The
        prior condition is carried forward so the screen can default sensibly
        (FR-409), together with the reference timing for the checkpoint (FR-412).
      operationId: getCheckpointEntry
      responses:
        '200':
          description: Entry screen payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /observations/embryo:
    post:
      tags: [Observations]
      summary: Record embryo observations (bulk, idempotent)
      description: |
        The main write path of the system. Send the whole checkpoint in one call.

        **Idempotent on `clientUuid`** (BR-18): a repeat of a `clientUuid` the
        server already has returns `duplicate` with the stored row and HTTP 200 —
        never an error, never a second row. The offline queue depends on this;
        without it a request that succeeded but whose response was lost would
        double-count and corrupt the survival numbers.

        Per item the server computes `hpaActual` (BR-02), reads `hpaExpected`
        from the profile pinned to the batch and **freezes it onto the row**
        (BR-03), and derives `deviationH` (BR-04).

        Recording `DEAD` or `DEGENERATED` also writes the embryo's terminal exit
        event. Later observations are rejected to preserve monotonic survival
        (BR-07), even when an override reason is supplied. A mistaken terminal
        result must be corrected or deleted on its original audited observation.
        Request-level conflicts still use `409`.

        Partial success is normal: each item reports its own status, so one bad
        row never discards the rest of the checkpoint.
      operationId: createEmbryoObservations
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/EmbryoObservationInput' }
            examples:
              checkpoint:
                summary: One checkpoint, one embryo alive and one dead
                value:
                  observations:
                    - clientUuid: 0192f3a1-7c4e-7000-8000-1a2b3c4d5e6f
                      embryoId: 0192f0aa-0000-7000-8000-000000000001
                      stageCode: stage_09_256C
                      observedAt: '2026-08-20T12:38:00+07:00'
                      outcome: ALIVE
                      condition: NORMAL
                    - clientUuid: 0192f3a1-7c4e-7000-8000-1a2b3c4d5e70
                      embryoId: 0192f0aa-0000-7000-8000-000000000002
                      stageCode: stage_09_256C
                      observedAt: '2026-08-20T12:38:00+07:00'
                      outcome: DEAD
                      condition: NORMAL
      responses:
        '200':
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/EmbryoObservationResult' }
              examples:
                mixed:
                  summary: One created, one already seen
                  value:
                    results:
                      - clientUuid: 0192f3a1-7c4e-7000-8000-1a2b3c4d5e6f
                        id: 0192f3b0-0000-7000-8000-000000000001
                        status: created
                        hpaActual: 2.6333
                        hpaExpected: 2.5
                        deviationH: 0.1333
                        deviationLabel: ช้ากว่าสากล 8 นาที
                        exitRecorded: false
                      - clientUuid: 0192f3a1-7c4e-7000-8000-1a2b3c4d5e70
                        id: 0192f3b1-0000-7000-8000-000000000002
                        status: duplicate
                        hpaActual: 2.6333
                        hpaExpected: 2.5
                        deviationH: 0.1333
                        deviationLabel: ช้ากว่าสากล 8 นาที
                        exitRecorded: true

  /observations/embryo/{id}:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    patch:
      tags: [Observations]
      summary: Correct a mis-entered embryo observation
      description: |
        Corrections are recorded, not hidden (FR-1101, FR-1102). Editing the
        outcome recalculates the embryo's exit event; editing the condition can
        clear or move `firstAbnormal` (BR-12). `hpaExpectedSnapshot` remains
        frozen; editing `observedAt` recalculates `hpaActual` and `deviationH`
        against that original snapshot (BR-03).
      operationId: updateEmbryoObservation
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observedAt: { type: string, format: date-time }
                outcome: { $ref: '#/components/schemas/EmbryoOutcome' }
                condition: { $ref: '#/components/schemas/Condition' }
                notes: { type: [string, 'null'] }
                correctionReason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbryoObservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Observations]
      summary: Soft-delete an observation
      operationId: deleteEmbryoObservation
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      responses:
        '204': { description: Soft-deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /fish/roll-call:
    get:
      tags: [Observations]
      summary: The daily fish check-list
      description: |
        Living fish only (FR-602), with age computed from date of birth (BR-11)
        and a flag for any fish already known to be abnormal, including the age
        at which that was first seen (FR-605). `date` may be in the past so a
        missed day can be filled in later (FR-607, Q-N4 backdating).
      operationId: getFishRollCall
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: boxId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Roll-call list
          content:
            application/json:
              schema:
                type: object
                required: [date, items]
                properties:
                  date: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RollCallEntry' }

  /observations/fish:
    post:
      tags: [Observations]
      summary: Record fish observations (bulk, idempotent)
      description: |
        Same idempotency contract as the embryo endpoint (BR-18). "Everyone still
        alive" is one call carrying every living fish (FR-604, AC-604).

        An outcome of `DEAD`, `FROZEN`, or `DISCARDED` also closes the fish:
        `status`, `exitDate`, and `exitReason` are set, and it drops off the next
        day's roll-call (FR-606, AC-606).

        For a consecutive date range, the client expands each fish/date into a
        separate item with its own `clientUuid`. This keeps retries idempotent.
      operationId: createFishObservations
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/FishObservationInput' }
      responses:
        '200':
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/FishObservationResult' }

  /observations/fish/{id}:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    patch:
      tags: [Observations]
      summary: Correct a fish observation
      operationId: updateFishObservation
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FishObservationPatchInput' }
      responses:
        '204': { description: Corrected and audited }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Observations]
      summary: Soft-delete an incorrect fish observation
      operationId: deleteFishObservation
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: reason
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '204': { description: Soft-deleted and audited }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- promotion
  /promotions/pending:
    get:
      tags: [Promotion]
      summary: Embryos that qualify to become clone fish
      description: |
        Qualifies when all of BR-09 hold: older than `stage1MaxAgeDays` (5 days
        by default, so past 120 h), no exit event, and last observation `ALIVE`.
        Abnormal embryos qualify like any other (FR-506, Q4).

        Each entry carries a suggested `fishCode` and `runningNo` (BR-13, BR-14)
        which the caller may override.
      operationId: listPendingPromotions
      parameters:
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PromotionCandidate' }

  /promotions:
    post:
      tags: [Promotion]
      summary: Promote embryos into the fish register
      description: |
        Always explicit — the system never promotes on its own (FR-504).

        The new fish inherits its date of birth from the lot's `activatedAt`,
        **not** from the day it was promoted (BR-10, AC-505), along with the
        donor line, site, condition, and any first-abnormal marker. The embryo
        is closed with `exitReason = PROMOTED`, which keeps it counted as a
        survivor rather than a loss in the survival curves.

        Running numbers are allocated inside the same transaction so two people
        promoting at once cannot collide (BR-14).
      operationId: createPromotions
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promotions]
              properties:
                promotions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [clientUuid, embryoId]
                    properties:
                      clientUuid: { type: string, format: uuid }
                      embryoId: { type: string, format: uuid }
                      fishCode:
                        type: [string, 'null']
                        description: Overrides the server's suggestion.
                        examples: ['No.47_Clone1-AB cell-24']
                      fishBoxId: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Fish created
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PromotionResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------------- fish
  /fish:
    get:
      tags: [Fish]
      summary: The clone fish register
      operationId: listFish
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FishStatus' } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: boxId, in: query, schema: { type: string, format: uuid } }
        - { name: experimentGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: treatmentGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: operatorId, in: query, schema: { type: string, format: uuid } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: donorCellLineId, in: query, schema: { type: string, format: uuid } }
        - { name: strain, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { $ref: '#/components/schemas/Condition' } }
        - { name: dobFrom, in: query, schema: { type: string, format: date } }
        - { name: dobTo, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Fish
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CloneFish' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Fish]
      summary: Register a fish by hand
      description: For fish that did not come through the normal promotion path (FR-509).
      operationId: createFish
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneFishInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneFish' }
        '409': { $ref: '#/components/responses/Conflict' }

  /fish/{id}:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    get:
      tags: [Fish]
      summary: One fish with its full observation timeline
      operationId: getFish
      responses:
        '200':
          description: Fish detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneFishDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Fish]
      summary: Update a fish
      description: Sex is usually only determinable weeks in (FR-609), so it can be set at any time.
      operationId: updateFish
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fishCode: { type: string }
                sex: { $ref: '#/components/schemas/Sex' }
                finClipped: { type: boolean }
                fishBoxId: { type: [string, 'null'], format: uuid }
                remarks: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneFish' }
        '404': { $ref: '#/components/responses/NotFound' }

  /fish/{id}/specimens:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    get:
      tags: [Fish]
      summary: List DNA specimens taken from a fish
      operationId: listFishSpecimens
      responses:
        '200':
          description: Specimens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Specimen' }
    post:
      tags: [Fish]
      summary: Record a DNA specimen
      operationId: createSpecimen
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpecimenInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Specimen' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------- analytics
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Complete analytics dashboard from one consistent snapshot
      description: Bundles all dashboard panels so filters and counts cannot drift between requests.
      operationId: getAnalyticsDashboard
      parameters:
        - $ref: '#/components/parameters/AnalyticsFilters'
        - name: stage1GroupBy
          in: query
          description: Stage 1 chart grouping; include site plus at most one comparison dimension.
          schema:
            type: array
            items: { type: string, enum: [site, strain, treatmentGroup, operator] }
        - name: stage2GroupBy
          in: query
          description: Stage 2 Kaplan-Meier comparison dimension; omit for the overall curve.
          schema:
            type: array
            items: { type: string, enum: [condition, strain, treatmentGroup] }
      responses:
        '200':
          description: Dashboard analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardAnalyticsResponse' }

  /analytics/kpi:
    get:
      tags: [Analytics]
      summary: Headline numbers for both stages
      operationId: getKpi
      parameters: [ $ref: '#/components/parameters/AnalyticsFilters' ]
      responses:
        '200':
          description: KPIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiResponse' }

  /analytics/funnel:
    get:
      tags: [Analytics]
      summary: Survivors at each checkpoint, with percentage of activated
      description: Percentages follow BR-17 and are always computed live, never stored (DC-04).
      operationId: getFunnel
      parameters: [ $ref: '#/components/parameters/AnalyticsFilters' ]
      responses:
        '200':
          description: Funnel
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FunnelStep' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }

  /analytics/survival:
    get:
      tags: [Analytics]
      summary: Monotonic discrete-time survival by checkpoint
      description: |
        Returns `riskSet`, `alive`, `nPrev`, `nDead` and monotonic `surv` per BR-15 and
        BR-16, grouped by site and strain — the same shape the lab's existing R
        notebook consumes.

        `riskSet` excludes embryos that have not yet reached the checkpoint's
        due time, so an experiment still in progress does not read as mass
        mortality. The raw `alive` and `nPrev` counts are always returned alongside `surv` so the
        analyst can recompute survival their own way rather than trusting ours.
      operationId: getSurvival
      parameters:
        - $ref: '#/components/parameters/AnalyticsFilters'
        - name: groupBy
          in: query
          schema:
            type: array
            items: { type: string, enum: [site, strain, treatmentGroup, operator] }
          examples: { default: { value: [site, strain] } }
      responses:
        '200':
          description: Survival table
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SurvivalPoint' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }

  /analytics/timing-deviation:
    get:
      tags: [Analytics]
      summary: How far development ran ahead of or behind the reference times
      description: |
        Distribution of `deviationH` per checkpoint. Positive means slower than
        the reference, negative means faster. There is deliberately no
        pass/fail threshold — the lab asked for the raw difference and nothing
        more (Q-N5, BR-04).
      operationId: getTimingDeviation
      parameters:
        - $ref: '#/components/parameters/AnalyticsFilters'
        - name: groupBy
          in: query
          schema:
            type: array
            items: { type: string, enum: [site, strain, treatmentGroup, operator] }
      responses:
        '200':
          description: Deviation summary
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviationSummary' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }

  /analytics/abnormality-onset:
    get:
      tags: [Analytics]
      summary: Where abnormality is first seen
      operationId: getAbnormalityOnset
      parameters: [ $ref: '#/components/parameters/AnalyticsFilters' ]
      responses:
        '200':
          description: Onset histogram
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [stageOrder, stageLabel, count]
                      properties:
                        stageOrder: { type: integer }
                        stageLabel: { type: string }
                        count: { type: integer }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }

  /analytics/fish-survival:
    get:
      tags: [Analytics]
      summary: Kaplan-Meier daily survival of clone fish
      operationId: getFishSurvival
      parameters:
        - $ref: '#/components/parameters/AnalyticsFilters'
        - name: splitByCondition
          in: query
          description: Return Ever abnormal, No abnormality recorded, and unknown fish as separate exploratory series (FR-817)
          schema: { type: boolean, default: false }
        - name: groupBy
          in: query
          description: One optional comparison dimension for the Kaplan-Meier chart; omit for the overall curve.
          schema:
            type: array
            items: { type: string, enum: [condition, strain, treatmentGroup] }
      responses:
        '200':
          description: Fish survival series with daily events and right-censoring
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, supporting]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [ageDays, atRisk, alive, surv]
                      properties:
                        group: { type: [string, 'null'] }
                        condition: { type: [string, 'null'], description: Current comparison group when splitByCondition=true. }
                        abnormalityGroup:
                          type: [string, 'null']
                          description: Semantic comparison group — EVER_ABNORMAL, NO_ABNORMALITY_RECORDED, or UNKNOWN.
                        strain: { type: [string, 'null'] }
                        treatmentGroup: { type: [string, 'null'] }
                        ageDays: { type: integer }
                        atRisk: { type: integer }
                        alive: { type: integer }
                        nEvents: { type: integer, description: Death events at this age. }
                        nCensored: { type: integer, description: Right-censored fish at this age. }
                        nAlive: { type: integer }
                        nDead: { type: integer }
                        nFrozen: { type: integer }
                        nDiscarded: { type: integer }
                        nMale: { type: integer }
                        nFemale: { type: integer }
                        nUnknownSex: { type: integer }
                        nBoxes: { type: integer }
                        surv: { type: number, description: Kaplan-Meier survival estimate. }
                        survLower95: { type: number, description: Approximate Greenwood 95% lower confidence bound. }
                        survUpper95: { type: number, description: Approximate Greenwood 95% upper confidence bound. }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
                  supporting:
                    type: object
                    required: [statusComposition, ageDistribution, ageDefinition, sexComposition, sexCompleteness, boxCensus, boxMeta]
                    properties:
                      statusComposition:
                        type: array
                        items:
                          type: object
                          required: [status, n, pct]
                          properties:
                            status: { type: string }
                            n: { type: integer, minimum: 0 }
                            pct: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      ageDistribution:
                        type: array
                        items:
                          type: object
                          required: [bin, minDays, maxDays, n, pct]
                          properties:
                            bin: { type: string }
                            minDays: { type: integer, minimum: 0 }
                            maxDays: { type: [integer, 'null'], minimum: 0 }
                            n: { type: integer, minimum: 0 }
                            pct: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      ageDefinition: { type: string }
                      sexComposition:
                        type: array
                        items:
                          type: object
                          required: [sex, n, pct]
                          properties:
                            sex: { type: string }
                            n: { type: integer, minimum: 0 }
                            pct: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      sexCompleteness:
                        type: object
                        required: [known, unknown, pctComplete]
                        properties:
                          known: { type: integer, minimum: 0 }
                          unknown: { type: integer, minimum: 0 }
                          pctComplete: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      boxCensus:
                        type: array
                        items:
                          type: object
                          required: [boxCode, n, pct, empty, statusCounts]
                          properties:
                            fishBoxId: { type: [string, 'null'] }
                            boxCode: { type: string }
                            n: { type: integer, minimum: 0 }
                            pct: { type: [number, 'null'], minimum: 0, maximum: 1 }
                            empty: { type: boolean }
                            statusCounts:
                              type: object
                              required: [ALIVE, DEAD, FROZEN, DISCARDED, UNKNOWN]
                              properties:
                                ALIVE: { type: integer, minimum: 0 }
                                DEAD: { type: integer, minimum: 0 }
                                FROZEN: { type: integer, minimum: 0 }
                                DISCARDED: { type: integer, minimum: 0 }
                                UNKNOWN: { type: integer, minimum: 0 }
                      boxMeta:
                        type: object
                        required: [nBoxes, emptyBoxes]
                        properties:
                          nBoxes: { type: integer, minimum: 0 }
                          emptyBoxes: { type: integer, minimum: 0 }
                      missingExitDate: { type: integer, minimum: 0 }

  /analytics/observation-gaps:
    get:
      tags: [Analytics]
      summary: Fish that have missed a daily check
      description: Drives the reminder to backfill (FR-822).
      operationId: getObservationGaps
      parameters: [ $ref: '#/components/parameters/AnalyticsFilters' ]
      responses:
        '200':
          description: Gaps
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [fishId, fishCode, lastObservedOn, missedDays]
                      properties:
                        fishId: { type: string, format: uuid }
                        fishCode: { type: string }
                        lastObservedOn: { type: [string, 'null'], format: date }
                        missedDays: { type: integer }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }

  /analytics/pipeline:
    get:
      tags: [Analytics]
      summary: End-to-end funnel across both stages
      description: |
        Joins Stage 1 and Stage 2 into a single chain — something the lab's
        spreadsheets cannot do today because the two live in separate sheets
        with no key between them (FR-823).
      operationId: getPipeline
      parameters: [ $ref: '#/components/parameters/AnalyticsFilters' ]
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [step, count, pctOfStart]
                      properties:
                        step: { type: string, examples: ['Reached Shield'] }
                        count: { type: integer }
                        pctOfStart: { type: [number, 'null'] }
                        pctOfPrevious: { type: [number, 'null'] }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }

  # -------------------------------------------------------------------- export
  /exports/excel:
    post:
      tags: [Export]
      summary: Build a clean analysis table or the detailed 14-sheet workbook
      description: |
        Uses the same filters as the dashboard (FR-905). Every sheet is a flat
        table with a single header row and no merged cells (FR-902) so pandas
        and readxl can read it directly — which is precisely what the current
        spreadsheets cannot do.

        Generated and returned directly per request; nothing is written to disk (FR-909,
        CON-05), which is also what lets the backend run on a filesystem-less
        platform.
      operationId: exportExcel
      x-read-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          description: Workbook
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="kuvth-zebrafish-lims-export.xlsx"'] }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /exports/r-table:
    get:
      tags: [Export]
      summary: The analysis table as CSV
      description: |
        Columns `Sites, Strain, Replicate, Strain_Rep` followed by one column per
        checkpoint, matching the shape the lab's R notebook already expects
        (FR-904, AC-904).
      operationId: exportRTable
      parameters: [ $ref: '#/components/parameters/AnalyticsFilters' ]
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }

  # --------------------------------------------------------------------- audit
  /audit-log:
    get:
      tags: [Audit]
      summary: Change history
      operationId: listAuditLog
      parameters:
        - { name: table, in: query, schema: { type: string, maxLength: 128 } }
        - { name: recordId, in: query, schema: { type: string, format: uuid } }
        - { name: operatorId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextCursor: { type: [string, 'null'] }

  /health:
    get:
      summary: Service health
      operationId: getHealth
      responses:
        '200':
          description: API is ready to serve requests
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

components:

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperatorId:
      name: X-Operator-Id
      in: header
      required: true
      description: Who is doing this. Required on every write because there is no login (CON-01, FR-1105).
      schema: { type: string, format: uuid }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Stable per-device identifier generated on first use and kept in local storage.
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Stable key for one logical mutation. Replays return the original result.
      schema: { type: string, format: uuid }
    IncludeInactive:
      name: includeInactive
      in: query
      description: Include deactivated rows. Off by default so dropdowns stay clean (FR-111).
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    AnalyticsFilters:
      name: filters
      in: query
      description: |
        Every `/analytics` endpoint accepts the same filter set, so the dashboard
        can swap panels without rebuilding its query state:
        `dateFrom`, `dateTo`, `siteId`, `operatorId`, `experimentGroupId`, `treatmentGroupId`,
        `donorCellLineId`, `strain`, `batchId`.
      style: form
      explode: true
      schema: { $ref: '#/components/schemas/AnalyticsFilter' }

  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with current state — for example a duplicate normalised name, or a monotonic-survival violation without an override reason
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Well-formed but breaks a business rule (BR-19)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            beforeActivation:
              summary: Observation timed before its lot was activated
              value:
                error:
                  code: OBSERVATION_BEFORE_ACTIVATION
                  message: เวลาที่สังเกตอยู่ก่อนเวลา activation ของล็อตนี้
                  field: observedAt
                  details:
                    observedAt: '2026-08-20T09:00:00+07:00'
                    activatedAt: '2026-08-20T10:59:00+07:00'

  schemas:

    # ---- shared enums -------------------------------------------------------
    EmbryoOutcome:
      type: string
      enum: [ALIVE, DEAD, DEGENERATED, NOT_OBSERVED]
      description: DEGENERATED is kept distinct from DEAD because the lab records the two separately.
    FishOutcome:
      type: string
      enum: [ALIVE, DEAD, FROZEN, DISCARDED, NOT_OBSERVED]
    Condition:
      type: string
      enum: [NORMAL, ABNORMAL, UNDETERMINED]
    FishHealthStatus:
      type: string
      enum: [HEALTHY, WEAK, SICK, DISABLED, AGED, UNDETERMINED]
    FishStatus:
      type: string
      enum: [ALIVE, DEAD, FROZEN, DISCARDED]
    Sex:
      type: string
      enum: [M, F, UNKNOWN]
    ExitReason:
      type: string
      enum: [DEAD, DEGENERATED, PROMOTED, LOST]
      description: PROMOTED means the embryo survived into the fish register — a success, not a loss.
    ArmType:
      type: string
      enum: [SCNT, NATURAL_BREEDING, IVF]
    ControlArmType:
      type: string
      enum: [NATURAL_BREEDING, IVF]
    StagePhase:
      type: string
      enum: [CLEAVAGE, BLASTULA, GASTRULA, LARVAL]
    StageScope:
      type: string
      enum: [STAGE_1, STAGE_2]
    Preparation:
      type: string
      enum: [DISSOCIATED, CHUNKS]
    SpecimenKind:
      type: string
      enum: [CL, RT, DC]
      description: Clone, Recipient Tail, Donor Cell.
    SpecimenType:
      type: string
      enum: [WHOLE_EMBRYO, CAUDAL_FIN_CLIP]
    WriteStatus:
      type: string
      enum: [created, duplicate, rejected]
      description: '`duplicate` is a normal outcome of retrying, not a failure.'

    # ---- errors -------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [OBSERVATION_BEFORE_ACTIVATION]
            message:
              type: string
              description: Written for the person on the iPad, not for a log file (NFR-304).
            field: { type: [string, 'null'] }
            details: { type: [object, 'null'], additionalProperties: true }

    # ---- master data --------------------------------------------------------
    Site:
      type: object
      required: [id, code, name, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [KU] }
        name: { type: string, examples: [Kasetsart University] }
        active: { type: boolean }
    SiteInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
        name: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean, default: true }
    SitePatchInput:
      type: object
      minProperties: 1
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
        name: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean }

    Operator:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: [string, 'null'], format: uuid }
        name: { type: string, examples: [Jan] }
        active: { type: boolean }
    OperatorInput:
      type: object
      required: [name]
      properties:
        siteId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean, default: true }
    OperatorPatchInput:
      type: object
      minProperties: 1
      properties:
        siteId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean }

    DonorCellLine:
      type: object
      required: [id, strain, preparation, active]
      properties:
        id: { type: string, format: uuid }
        strain: { type: string, examples: [AB] }
        preparation: { $ref: '#/components/schemas/Preparation' }
        preservation: { type: [string, 'null'], enum: [FRESH, CRYOPRESERVED, null] }
        sampleInfo: { type: [string, 'null'], maxLength: 1000, description: Cryovial or sample-level detail. }
        batchCode: { type: [string, 'null'], examples: [AB240426_e48h] }
        active: { type: boolean }
    DonorCellLineInput:
      type: object
      required: [strain, preparation, preservation]
      properties:
        strain: { type: string, minLength: 1, maxLength: 50 }
        preparation: { $ref: '#/components/schemas/Preparation' }
        preservation: { type: string, enum: [FRESH, CRYOPRESERVED] }
        sampleInfo: { type: [string, 'null'], maxLength: 1000, description: Cryovial or sample-level detail. }
        batchCode: { type: [string, 'null'], maxLength: 100 }
        active: { type: boolean, default: true }
    DonorCellLinePatchInput:
      type: object
      minProperties: 1
      properties:
        strain: { type: string, minLength: 1, maxLength: 50 }
        preparation: { $ref: '#/components/schemas/Preparation' }
        preservation: { type: [string, 'null'], enum: [FRESH, CRYOPRESERVED, null] }
        sampleInfo: { type: [string, 'null'], maxLength: 1000, description: Cryovial or sample-level detail. }
        batchCode: { type: [string, 'null'], maxLength: 100 }
        active: { type: boolean }

    RecipientEggLot:
      type: object
      required: [id, breed, label, active]
      properties:
        id: { type: string, format: uuid }
        breed: { type: string, examples: [TAB Taiwan] }
        lotDate: { type: [string, 'null'], format: date }
        donorFishCode: { type: [string, 'null'], maxLength: 150 }
        label: { type: string, examples: ['TAB Taiwan 29-04-2025'] }
        active: { type: boolean }
    RecipientEggLotInput:
      type: object
      required: [breed, label]
      properties:
        breed: { type: string, minLength: 1, maxLength: 100 }
        lotDate: { type: [string, 'null'], format: date }
        donorFishCode: { type: [string, 'null'], maxLength: 150 }
        label: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean, default: true }
    RecipientEggLotPatchInput:
      type: object
      minProperties: 1
      properties:
        breed: { type: string, minLength: 1, maxLength: 100 }
        lotDate: { type: [string, 'null'], format: date }
        donorFishCode: { type: [string, 'null'], maxLength: 150 }
        label: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean }

    CsofLot:
      type: object
      required: [id, lotCode, active]
      properties:
        id: { type: string, format: uuid }
        lotCode: { type: string, examples: ['CSOF 2024-19'] }
        active: { type: boolean }
    CsofLotInput:
      type: object
      required: [lotCode]
      properties:
        lotCode: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean, default: true }
    CsofLotPatchInput:
      type: object
      minProperties: 1
      properties:
        lotCode: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean }

    ExperimentGroup:
      type: object
      required: [id, code, name, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
    ExperimentGroupInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
    ExperimentGroupPatchInput:
      type: object
      minProperties: 1
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        active: { type: boolean }

    TreatmentGroup:
      type: object
      required: [id, code, armType, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [RK701] }
        name: { type: [string, 'null'] }
        armType: { $ref: '#/components/schemas/ArmType' }
        active: { type: boolean }
    TreatmentGroupInput:
      type: object
      required: [code, armType]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: [string, 'null'], maxLength: 200 }
        armType: { $ref: '#/components/schemas/ArmType' }
        active: { type: boolean, default: true }
    TreatmentGroupPatchInput:
      type: object
      minProperties: 1
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: [string, 'null'], maxLength: 200 }
        armType: { $ref: '#/components/schemas/ArmType' }
        active: { type: boolean }

    FishBox:
      type: object
      required: [id, boxCode, active]
      properties:
        id: { type: string, format: uuid }
        boxCode: { type: string, examples: [Box-4] }
        siteId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
    FishBoxInput:
      type: object
      required: [boxCode]
      properties:
        boxCode: { type: string, minLength: 1, maxLength: 50 }
        siteId: { type: [string, 'null'], format: uuid }
        active: { type: boolean, default: true }
    FishBoxPatchInput:
      type: object
      minProperties: 1
      properties:
        boxCode: { type: string, minLength: 1, maxLength: 50 }
        siteId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }

    # ---- protocol and timing ------------------------------------------------
    Protocol:
      type: object
      required: [id, name, stage1MaxAgeDays, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [SCNT standard] }
        stage1MaxAgeDays:
          type: integer
          description: Age past which a surviving embryo becomes eligible for promotion (BR-09).
          examples: [5]
        active: { type: boolean }

    StageDefinition:
      type: object
      required: [id, stageOrder, code, label, shortLabel, phase, stageScope]
      properties:
        id: { type: string, format: uuid }
        stageOrder: { type: integer, examples: [9] }
        code: { type: string, examples: [stage_09_256C] }
        label:
          type: string
          description: Always English, in both UI languages (NFR-703).
          examples: [256-cell]
        shortLabel: { type: string, examples: ['256C'] }
        phase: { $ref: '#/components/schemas/StagePhase' }
        stageScope: { $ref: '#/components/schemas/StageScope' }

    TimingProfile:
      type: object
      required: [id, protocolId, version, name, isCurrent, entries]
      properties:
        id: { type: string, format: uuid }
        protocolId: { type: string, format: uuid }
        version: { type: integer, examples: [1] }
        name: { type: string, examples: ['ZFIN 28.5C (default)'] }
        referenceTempC: { type: [number, 'null'], examples: [28.5] }
        autoTempAdjust:
          type: boolean
          description: Always false in v1 (Q-N2); the field exists so enabling FR-207 later needs no migration.
        sourceNote: { type: [string, 'null'], examples: ['Kimmel et al. 1995 / ZFIN, 28.5 C'] }
        isCurrent: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdByOperatorId: { type: [string, 'null'], format: uuid }
        entries:
          type: array
          items:
            type: object
            required: [stageCode, expectedHpa]
            properties:
              stageOrder: { type: integer, description: Derived from stageCode when omitted. }
              stageCode: { type: string }
              stageLabel: { type: string, description: Derived from the canonical stage when omitted. }
              expectedHpa: { type: number, examples: [2.5] }

    # ---- experiments --------------------------------------------------------
    Batch:
      type: object
      required: [id, batchCode, experimentDate, siteId, operatorId, protocolId, timingProfileId, treatmentGroupId]
      properties:
        id: { type: string, format: uuid }
        batchCode: { type: string, examples: ['1_Jan_Control'] }
        experimentDate: { type: string, format: date }
        dayNo: { type: [integer, 'null'] }
        siteId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        protocolId: { type: string, format: uuid }
        timingProfileId:
          type: string
          format: uuid
          description: Pinned when the batch was created and never changed afterwards (FR-303, BR-21).
        timingProfileVersion: { type: integer }
        experimentGroupId: { type: [string, 'null'], format: uuid }
        treatmentGroupId: { type: string, format: uuid }
        recipientEggLotId: { type: [string, 'null'], format: uuid }
        csofLotId: { type: [string, 'null'], format: uuid }
        clutchCode: { type: [string, 'null'], examples: [E6] }
        replicateNo: { type: [integer, 'null'] }
        incubationTempC:
          type: [number, 'null']
          description: Recorded but unused in v1 (ASM-01, Q-N2).
        notes: { type: [string, 'null'] }
        hasOpenEmbryos:
          type: boolean
          readOnly: true
          description: True when at least one active embryo in this experiment has no terminal exit reason.
        nInjectionLots:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of active injection lots in this experiment.
        nextLotNo:
          type: string
          readOnly: true
          description: Next numeric lot number for this Code of Egg or clutch code and experiment date; when neither is linked, numbering is scoped to the batch.
    BatchInput:
      type: object
      required: [experimentDate, siteId, operatorId, protocolId, treatmentGroupId]
      properties:
        batchCode:
          type: [string, 'null']
          description: Omit to let the server suggest `{dayNo}_{operator}_{treatmentGroup}` (FR-302).
        experimentDate: { type: string, format: date }
        dayNo: { type: [integer, 'null'] }
        siteId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        protocolId: { type: string, format: uuid }
        experimentGroupId: { type: [string, 'null'], format: uuid }
        treatmentGroupId: { type: string, format: uuid }
        recipientEggLotId: { type: [string, 'null'], format: uuid }
        csofLotId: { type: [string, 'null'], format: uuid }
        clutchCode: { type: [string, 'null'], maxLength: 50 }
        replicateNo: { type: [integer, 'null'], minimum: 1 }
        incubationTempC: { type: [number, 'null'], minimum: 0, maximum: 50 }
        notes: { type: [string, 'null'] }
    BatchDetail:
      allOf:
        - $ref: '#/components/schemas/Batch'
        - type: object
          properties:
            injectionLots:
              type: array
              items: { $ref: '#/components/schemas/InjectionLot' }

    InjectionLot:
      type: object
      required: [id, batchId, lotNo, donorCellLineId, nActivated]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        lotNo:
          type: string
          description: Server-generated sequence within the Code of Egg or clutch code and experiment date; otherwise scoped to the batch.
          examples: ['1']
        donorCellLineId: { type: string, format: uuid }
        enuPowerPct: { type: [integer, 'null'], examples: [100] }
        enuPulseUs: { type: [integer, 'null'], examples: [500] }
        enuLed: { type: [integer, 'null'], examples: [85] }
        enuStartAt: { type: [string, 'null'], format: date-time }
        enuFinishAt: { type: [string, 'null'], format: date-time }
        activatedAt:
          type: [string, 'null']
          format: date-time
          description: T0 for everything downstream (BR-01); null only for a copied draft template.
        nEggs: { type: [integer, 'null'] }
        nManipulated: { type: [integer, 'null'], minimum: 0 }
        nActivated: { type: integer }
        notes: { type: [string, 'null'] }
    InjectionLotInput:
      type: object
      description: The server assigns the next lotNo for the Code of Egg or clutch code and date. If neither code is linked, numbering is scoped to the batch.
      required: [donorCellLineId, activatedAt, nActivated]
      properties:
        donorCellLineId: { type: string, format: uuid }
        enuPowerPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        enuPulseUs: { type: [integer, 'null'], minimum: 0 }
        enuLed: { type: [integer, 'null'], minimum: 0 }
        enuStartAt: { type: [string, 'null'], format: date-time }
        enuFinishAt: { type: [string, 'null'], format: date-time }
        activatedAt: { type: string, format: date-time }
        nEggs: { type: [integer, 'null'], minimum: 0 }
        nManipulated: { type: [integer, 'null'], minimum: 0 }
        nActivated:
          type: integer
          minimum: 1
          maximum: 96
          description: This many embryo records are created immediately (FR-308).
        wellPositions:
          type: [array, 'null']
          description: Optional, in sequence order; entry i is the well of embryo i+1.
          items: { type: string, pattern: '^[A-H](1[0-2]|[1-9])$' }
        notes: { type: [string, 'null'] }
    InjectionLotActivationInput:
      type: object
      required: [activatedAt, nActivated]
      properties:
        donorCellLineId: { type: string, format: uuid }
        enuPowerPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        enuPulseUs: { type: [integer, 'null'], minimum: 0 }
        enuLed: { type: [integer, 'null'], minimum: 0 }
        enuStartAt: { type: [string, 'null'], format: date-time }
        enuFinishAt: { type: [string, 'null'], format: date-time }
        activatedAt: { type: string, format: date-time }
        nEggs: { type: [integer, 'null'], minimum: 0 }
        nManipulated: { type: [integer, 'null'], minimum: 0 }
        nActivated: { type: integer, minimum: 1, maximum: 96 }
        wellPositions:
          type: [array, 'null']
          items: { type: string, pattern: '^[A-H](1[0-2]|[1-9])$' }
        notes: { type: [string, 'null'] }
    InjectionLotDetail:
      allOf:
        - $ref: '#/components/schemas/InjectionLot'
        - type: object
          properties:
            embryos:
              type: array
              items: { $ref: '#/components/schemas/Embryo' }
            warnings:
              type: array
              description: Non-blocking business-rule warnings raised while creating or activating the lot (AC-307).
              items: { type: string }

    Embryo:
      type: object
      required: [id, injectionLotId, seqInLot, embryoCode]
      properties:
        id: { type: string, format: uuid }
        injectionLotId: { type: string, format: uuid }
        seqInLot: { type: integer, examples: [1] }
        embryoCode: { type: string, examples: ['1_Jan_Control_1_1'] }
        wellPosition: { type: [string, 'null'], examples: [B3] }
        exitStageCode: { type: [string, 'null'] }
        exitAt: { type: [string, 'null'], format: date-time }
        exitReason: { oneOf: [ { $ref: '#/components/schemas/ExitReason' }, { type: 'null' } ] }
        firstAbnormalStageCode: { type: [string, 'null'] }
        latestCondition: { oneOf: [ { $ref: '#/components/schemas/Condition' }, { type: 'null' } ] }

    ControlArmCount:
      type: object
      required: [id, batchId, armType, stageCode, nNormal, nAbnormal]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        armType: { $ref: '#/components/schemas/ControlArmType' }
        stageCode: { type: string }
        stageLabel: { type: string }
        nNormal: { type: integer }
        nAbnormal: { type: integer }

    # ---- observations -------------------------------------------------------
    DueCheckpoint:
      type: object
      required: [injectionLotId, batchCode, lotNo, stageCode, stageLabel, dueAt, minutesLate, embryosRemaining]
      properties:
        injectionLotId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        batchCode: { type: string }
        lotNo: { type: string }
        stageCode: { type: string }
        stageLabel: { type: string }
        stageOrder: { type: integer }
        dueAt: { type: string, format: date-time }
        minutesLate:
          type: integer
          description: Negative when the checkpoint is still in the future.
        embryosRemaining:
          type: integer
          description: Embryos without a terminal exit that remain eligible for observation.
        operatorName: { type: [string, 'null'] }

    CheckpointEntry:
      type: object
      required: [injectionLotId, batchCode, lotNo, stage, stages, activatedAt, expectedHpa, totalEmbryos, embryosRemaining, embryos]
      properties:
        injectionLotId: { type: string, format: uuid }
        batchCode: { type: string }
        lotNo: { type: string }
        stage: { $ref: '#/components/schemas/StageDefinition' }
        stages:
          type: array
          description: Stage 1 choices available independently for each embryo in this observation round.
          items:
            type: object
            required: [stageCode, stageLabel, stageOrder, expectedHpa]
            properties:
              stageCode: { type: string }
              stageLabel: { type: string }
              stageOrder: { type: integer }
              expectedHpa: { type: number }
        activatedAt: { type: string, format: date-time }
        expectedHpa: { type: number, examples: [2.5] }
        dueAt: { type: string, format: date-time }
        totalEmbryos: { type: integer }
        embryosRemaining: { type: integer }
        embryos:
          type: array
          items:
            type: object
            required: [embryoId, embryoCode, defaultCondition, isDead]
            properties:
              embryoId: { type: string, format: uuid }
              embryoCode: { type: string }
              wellPosition: { type: [string, 'null'] }
              defaultCondition:
                $ref: '#/components/schemas/Condition'
                description: Carried forward from the previous observation (FR-409).
              isDead:
                type: boolean
                description: True after a DEAD or DEGENERATED observation; shown read-only in later plate maps.
              priorOutcome:
                oneOf: [ { $ref: '#/components/schemas/EmbryoOutcome' }, { type: 'null' } ]
              priorStageCode: { type: [string, 'null'] }
              priorObservationId: { type: [string, 'null'], format: uuid }
              priorObservedAt: { type: [string, 'null'], format: date-time }
              priorNotes: { type: [string, 'null'] }
              history:
                type: array
                items:
                  type: object
                  required: [id, stageCode, stageLabel, observedAt, outcome, condition]
                  properties:
                    id: { type: string, format: uuid }
                    stageCode: { type: string }
                    stageLabel: { type: string }
                    observedAt: { type: string, format: date-time }
                    outcome: { $ref: '#/components/schemas/EmbryoOutcome' }
                    condition: { $ref: '#/components/schemas/Condition' }
                    notes: { type: [string, 'null'] }
                    operatorName: { type: [string, 'null'] }
              firstAbnormalStageLabel: { type: [string, 'null'] }

    EmbryoObservationInput:
      type: object
      required: [clientUuid, embryoId, stageCode, observedAt, outcome, condition]
      properties:
        clientUuid:
          type: string
          format: uuid
          description: Generated on the device before sending. The idempotency key (BR-18).
        embryoId: { type: string, format: uuid }
        stageCode: { type: string, examples: [stage_09_256C] }
        observedAt:
          type: string
          format: date-time
          description: Must fall between the lot's activation and now (BR-19).
        outcome: { $ref: '#/components/schemas/EmbryoOutcome' }
        condition: { $ref: '#/components/schemas/Condition' }
        notes: { type: [string, 'null'] }
        overrideReason:
          type: [string, 'null']
          maxLength: 500
          description: Audit context for exceptional writes; it cannot override a terminal embryo death.

    EmbryoObservationResult:
      type: object
      required: [clientUuid, status]
      properties:
        clientUuid: { type: string, format: uuid }
        id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/WriteStatus' }
        hpaActual: { type: [number, 'null'], examples: [2.6333] }
        hpaExpected: { type: [number, 'null'], examples: [2.5] }
        deviationH: { type: [number, 'null'], examples: [0.1333] }
        deviationPct: { type: [number, 'null'], examples: [5.33] }
        intervalActual: { type: [number, 'null'] }
        intervalExpected: { type: [number, 'null'] }
        intervalDeviationH: { type: [number, 'null'] }
        deviationLabel:
          type: [string, 'null']
          description: Preformatted for display per BR-23, so both platforms word it identically.
          examples: ['ช้ากว่าสากล 8 นาที']
        deviationLabelEn:
          type: [string, 'null']
          description: English BR-23 display label.
          examples: ['8 minutes slower than reference']
        isBackdated: { type: [boolean, 'null'] }
        exitRecorded: { type: [boolean, 'null'] }
        error: { type: [object, 'null'], additionalProperties: true }

    EmbryoObservation:
      type: object
      required: [id, embryoId, stageCode, observedAt, hpaActual, hpaExpectedSnapshot, deviationH, outcome, condition]
      properties:
        id: { type: string, format: uuid }
        clientUuid: { type: string, format: uuid }
        embryoId: { type: string, format: uuid }
        embryoCode: { type: string }
        stageCode: { type: string }
        stageOrder: { type: integer }
        observedAt: { type: string, format: date-time }
        hpaActual: { type: number }
        hpaExpectedSnapshot:
          type: number
          description: Frozen at write time so past results never shift when the reference is edited (BR-03, NFR-203).
        deviationH: { type: number }
        deviationPct: { type: [number, 'null'] }
        outcome: { $ref: '#/components/schemas/EmbryoOutcome' }
        condition: { $ref: '#/components/schemas/Condition' }
        operatorId: { type: string, format: uuid }
        isBackdated: { type: boolean }
        notes: { type: [string, 'null'] }

    RollCallEntry:
      type: object
      required: [fishId, fishCode, ageDays, status, condition, healthStatus, alreadyRecorded]
      properties:
        fishId: { type: string, format: uuid }
        fishCode: { type: string, examples: ['No.6_Clone3-AB cell-16'] }
        injectionLotId: { type: [string, 'null'], format: uuid }
        ageDays: { type: integer, examples: [329] }
        status: { $ref: '#/components/schemas/FishStatus' }
        condition: { $ref: '#/components/schemas/Condition' }
        healthStatus: { $ref: '#/components/schemas/FishHealthStatus' }
        strain: { type: [string, 'null'] }
        firstAbnormalOn: { type: [string, 'null'], format: date }
        firstAbnormalAgeDays: { type: [integer, 'null'] }
        fishBoxCode: { type: [string, 'null'] }
        alreadyRecorded:
          type: boolean
          description: True when this date already has an observation, so the screen can show it as done.
        observationId:
          type: [string, 'null']
          format: uuid
          description: Existing observation for this fish/date, used by the correction flow.
        recordedOutcome:
          oneOf:
            - $ref: '#/components/schemas/FishOutcome'
            - type: 'null'
        recordedCondition: { oneOf: [ { $ref: '#/components/schemas/Condition' }, { type: 'null' } ] }
        recordedHealthStatus: { oneOf: [ { $ref: '#/components/schemas/FishHealthStatus' }, { type: 'null' } ] }
        recordedNotes:
          type: [string, 'null']
          description: Existing observation note for this fish/date, used to prefill the daily note editor.

    FishObservationInput:
      type: object
      required: [clientUuid, cloneFishId, observedOn, outcome, condition, healthStatus]
      properties:
        clientUuid: { type: string, format: uuid }
        cloneFishId: { type: string, format: uuid }
        observedOn: { type: string, format: date }
        outcome: { $ref: '#/components/schemas/FishOutcome' }
        condition: { $ref: '#/components/schemas/Condition' }
        healthStatus: { $ref: '#/components/schemas/FishHealthStatus' }
        notes: { type: [string, 'null'] }
        overrideReason:
          type: [string, 'null']
          maxLength: 500
          description: Required by the server when the observation is backdated (BR-07, BR-19).

    FishObservationPatchInput:
      type: object
      minProperties: 2
      required: [overrideReason]
      properties:
        observedOn: { type: string, format: date }
        outcome: { $ref: '#/components/schemas/FishOutcome' }
        condition: { $ref: '#/components/schemas/Condition' }
        healthStatus: { $ref: '#/components/schemas/FishHealthStatus' }
        notes: { type: [string, 'null'] }
        overrideReason:
          type: string
          minLength: 1
          maxLength: 500
          description: Audit reason for correcting the observation.

    FishObservationResult:
      type: object
      required: [clientUuid, status]
      properties:
        clientUuid: { type: string, format: uuid }
        id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/WriteStatus' }
        ageDays: { type: [integer, 'null'] }
        fishClosed:
          type: [boolean, 'null']
          description: True when this observation ended the fish's tracking (FR-606).
        error: { type: [object, 'null'], additionalProperties: true }

    # ---- fish ---------------------------------------------------------------
    PromotionCandidate:
      type: object
      required: [embryoId, embryoCode, dob, ageDays, strain, condition, suggestedFishCode, suggestedRunningNo]
      properties:
        embryoId: { type: string, format: uuid }
        embryoCode: { type: string, examples: ['1_Jan_Control_2_1'] }
        batchCode: { type: string }
        dob:
          type: string
          format: date
          description: Date of the lot's activation, which becomes the fish's date of birth (BR-10).
        ageDays: { type: integer, examples: [6] }
        strain: { type: string }
        donorCellLineId: { type: string, format: uuid }
        siteId: { type: [string, 'null'], format: uuid }
        condition: { $ref: '#/components/schemas/Condition' }
        firstAbnormalStageLabel:
          type: [string, 'null']
          description: Abnormal embryos are promoted like any other; this just carries the marker across (FR-506).
        suggestedFishCode: { type: string, examples: ['No.47_Clone1-AB cell-24'] }
        suggestedRunningNo: { type: integer, examples: [47] }

    PromotionResult:
      type: object
      required: [clientUuid, status]
      properties:
        clientUuid: { type: string, format: uuid }
        id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/WriteStatus' }
        fish: { $ref: '#/components/schemas/CloneFish' }
        error: { type: [object, 'null'], additionalProperties: true }

    CloneFish:
      type: object
      required: [id, fishCode, runningNo, dob, donorCellLineId, status, condition, sex, finClipped]
      properties:
        id: { type: string, format: uuid }
        embryoId: { type: [string, 'null'], format: uuid }
        embryoCode: { type: [string, 'null'] }
        fishCode: { type: string, examples: ['No.6_Clone3-AB cell-16'] }
        runningNo: { type: integer }
        dob: { type: string, format: date }
        ageDays:
          type: integer
          description: Computed live from dob, never stored (BR-11, DC-04).
        strain: { type: string }
        donorCellLineId: { type: string, format: uuid }
        recipientEggLotId: { type: [string, 'null'], format: uuid }
        siteId: { type: [string, 'null'], format: uuid }
        fishBoxId: { type: [string, 'null'], format: uuid }
        fishBoxCode: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/FishStatus' }
        condition: { $ref: '#/components/schemas/Condition' }
        healthStatus: { $ref: '#/components/schemas/FishHealthStatus' }
        firstAbnormalOn: { type: [string, 'null'], format: date }
        firstAbnormalAgeDays: { type: [integer, 'null'] }
        sex: { $ref: '#/components/schemas/Sex' }
        finClipped: { type: boolean }
        exitDate: { type: [string, 'null'], format: date }
        exitReason: { type: [string, 'null'], enum: [DEAD, FROZEN, DISCARDED, LOST, null] }
        remarks: { type: [string, 'null'] }
    CloneFishInput:
      type: object
      required: [fishCode, dob, donorCellLineId, recipientEggLotId]
      properties:
        fishCode: { type: string, minLength: 1, maxLength: 150 }
        dob: { type: string, format: date }
        donorCellLineId: { type: string, format: uuid }
        recipientEggLotId: { type: string, format: uuid }
        siteId: { type: [string, 'null'], format: uuid }
        fishBoxId: { type: [string, 'null'], format: uuid }
        condition: { $ref: '#/components/schemas/Condition' }
        healthStatus: { $ref: '#/components/schemas/FishHealthStatus' }
        sex: { $ref: '#/components/schemas/Sex' }
        remarks: { type: [string, 'null'] }
        overrideReason:
          type: [string, 'null']
          maxLength: 500
          description: Required by the server when manually registering an older fish (BR-07).
    CloneFishDetail:
      allOf:
        - $ref: '#/components/schemas/CloneFish'
        - type: object
          properties:
            observations:
              type: array
              items:
                type: object
                required: [id, observedOn, ageDays, outcome, condition]
                properties:
                  id: { type: string, format: uuid }
                  observedOn: { type: string, format: date }
                  ageDays: { type: integer }
                  outcome: { $ref: '#/components/schemas/FishOutcome' }
                  condition: { $ref: '#/components/schemas/Condition' }
                  operatorName: { type: [string, 'null'] }
                  isBackdated: { type: boolean }
                  notes: { type: [string, 'null'] }
            specimens:
              type: array
              items: { $ref: '#/components/schemas/Specimen' }
            embryoTimeline:
              type: array
              description: The Stage 1 history of the embryo this fish came from, so one screen covers the whole life.
              items: { $ref: '#/components/schemas/EmbryoObservation' }

    Specimen:
      type: object
      required: [id, cloneFishId, specimenCode, specimenKind, specimenType]
      properties:
        id: { type: string, format: uuid }
        cloneFishId: { type: string, format: uuid }
        specimenCode: { type: string, examples: [CL1] }
        specimenKind: { $ref: '#/components/schemas/SpecimenKind' }
        specimenType: { $ref: '#/components/schemas/SpecimenType' }
        collectedOn: { type: [string, 'null'], format: date }
        frozenOn: { type: [string, 'null'], format: date }
        storage: { type: [string, 'null'], enum: ['-20', '-80', null] }
        notes: { type: [string, 'null'] }
    SpecimenInput:
      type: object
      required: [specimenCode, specimenKind, specimenType]
      properties:
        specimenCode: { type: string, maxLength: 50 }
        specimenKind: { $ref: '#/components/schemas/SpecimenKind' }
        specimenType: { $ref: '#/components/schemas/SpecimenType' }
        collectedOn: { type: [string, 'null'], format: date }
        frozenOn: { type: [string, 'null'], format: date }
        storage: { type: [string, 'null'], enum: ['-20', '-80', null] }
        notes: { type: [string, 'null'] }
        markFinClipped:
          type: boolean
          default: false
          description: Also set the fish's finClipped flag, so one action covers both (FR-610).

    # ---- analytics ----------------------------------------------------------
    AnalyticsFilter:
      type: object
      additionalProperties: false
      properties:
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        siteId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        experimentGroupId: { type: string, format: uuid }
        treatmentGroupId: { type: string, format: uuid }
        donorCellLineId: { type: string, format: uuid }
        strain: { type: string }
        batchId: { type: string, format: uuid }

    KpiResponse:
      type: object
      required: [stage1, stage2, meta]
      properties:
        stage1:
          type: object
          required: [nBatches, nActivated, nReachedShield, nReachedDay1, nPromoted, pctNormal, controlComparison]
          properties:
            nBatches: { type: integer }
            nActivated: { type: integer }
            nReachedShield: { type: integer }
            nReachedDay1: { type: integer }
            nPromoted: { type: integer }
            pctNormal: { type: [number, 'null'], minimum: 0, maximum: 1, description: Fraction of filtered embryos/fish marked NORMAL; null when the denominator is zero. }
            pctAbnormal: { type: [number, 'null'], minimum: 0, maximum: 1, description: Fraction of filtered embryos/fish marked ABNORMAL; null when the denominator is zero. }
            controlComparison:
              type: array
              items: { $ref: '#/components/schemas/ControlComparisonPoint' }
        stage2:
          type: object
          required: [nFish, nAlive, nDead, nFrozen, nDiscarded]
          properties:
            nFish: { type: integer }
            nAlive: { type: integer }
            nDead: { type: integer }
            nFrozen: { type: integer }
            nDiscarded: { type: integer }
            nNormal: { type: integer }
            nAbnormal: { type: integer }
            nUndetermined: { type: integer }
            meanAgeDaysAlive: { type: [number, 'null'] }
        meta: { $ref: '#/components/schemas/AnalyticsMeta' }

    DashboardAnalyticsResponse:
      type: object
      required: [reportMeta, kpi, funnel, survival, timingDeviation, abnormalityOnset, fishSurvival, observationGaps, pipeline]
      properties:
        reportMeta:
          type: object
          required: [generatedAt, timingProfileVersions]
          properties:
            generatedAt: { type: string, format: date-time }
            timingProfileVersions:
              type: array
              items: { type: integer, minimum: 1 }
        kpi: { $ref: '#/components/schemas/KpiResponse' }
        funnel: { $ref: '#/paths/~1analytics~1funnel/get/responses/200/content/application~1json/schema' }
        survival: { $ref: '#/paths/~1analytics~1survival/get/responses/200/content/application~1json/schema' }
        timingDeviation: { $ref: '#/paths/~1analytics~1timing-deviation/get/responses/200/content/application~1json/schema' }
        abnormalityOnset: { $ref: '#/paths/~1analytics~1abnormality-onset/get/responses/200/content/application~1json/schema' }
        fishSurvival: { $ref: '#/paths/~1analytics~1fish-survival/get/responses/200/content/application~1json/schema' }
        observationGaps: { $ref: '#/paths/~1analytics~1observation-gaps/get/responses/200/content/application~1json/schema' }
        pipeline: { $ref: '#/paths/~1analytics~1pipeline/get/responses/200/content/application~1json/schema' }

    ControlComparisonPoint:
      type: object
      required: [armType, stageOrder, stageCode, stageLabel, n, nNormal, nAbnormal, pctNormal, pctAbnormal]
      properties:
        armType: { $ref: '#/components/schemas/ArmType' }
        stageOrder: { type: integer }
        stageCode: { type: string }
        stageLabel: { type: string }
        n: { type: integer, minimum: 0 }
        nNormal: { type: integer, minimum: 0 }
        nAbnormal: { type: integer, minimum: 0 }
        pctNormal: { type: [number, 'null'], minimum: 0, maximum: 1 }
        pctAbnormal: { type: [number, 'null'], minimum: 0, maximum: 1 }

    AnalyticsMeta:
      type: object
      required: [filters, sampleSize, denominators, unknown, missing]
      properties:
        filters:
          type: object
          additionalProperties: { type: string }
        sampleSize: { type: integer, minimum: 0 }
        denominators:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        unknown:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        missing:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        method: { type: string, description: Statistical method used by the endpoint when applicable. }
        comparison:
          type: object
          description: Comparison labels and interpretation for exploratory groupings.
          required: [field, label, interpretation]
          properties:
            field: { type: string }
            label: { type: string }
            interpretation: { type: string }

    FunnelStep:
      type: object
      required: [stageOrder, stageCode, stageLabel, riskSet, alive, nDead, pctOfActivated]
      properties:
        stageOrder: { type: integer }
        stageCode: { type: string }
        stageLabel: { type: string }
        riskSet: { type: integer }
        alive: { type: integer }
        nDead: { type: integer }
        pctOfActivated: { type: [number, 'null'] }

    SurvivalPoint:
      type: object
      required: [stageOrder, stageLabel, riskSet, alive, nPrev, nDead, surv]
      properties:
        siteId: { type: [string, 'null'] }
        strain: { type: [string, 'null'] }
        treatmentGroupId: { type: [string, 'null'] }
        treatmentGroup: { type: [string, 'null'] }
        operatorId: { type: [string, 'null'] }
        stageOrder: { type: integer }
        stageLabel: { type: string }
        riskSet:
          type: integer
          description: Embryos that have actually reached this checkpoint's due time (BR-16).
        alive: { type: [integer, 'null'], description: Known alive embryos; null when the checkpoint has no observed outcomes. }
        nPrev: { type: integer, description: Observed previous-stage survivors included in this estimate. }
        nDead: { type: integer, description: Deaths observed in this estimate; missing checks are excluded. }
        surv: { type: [number, 'null'], examples: [0.4711], description: null when no checkpoint outcomes support an estimate. }
        pctOfDevelopment: { type: [number, 'null'] }

    DeviationSummary:
      type: object
      required: [stageOrder, stageLabel, n, meanDeviationH, medianDeviationH, q1DeviationH, q3DeviationH, minDeviationH, maxDeviationH]
      properties:
        siteId: { type: [string, 'null'] }
        strain: { type: [string, 'null'] }
        treatmentGroupId: { type: [string, 'null'] }
        treatmentGroup: { type: [string, 'null'] }
        operatorId: { type: [string, 'null'] }
        stageOrder: { type: integer }
        stageLabel: { type: string }
        expectedHpa: { type: number }
        n: { type: integer }
        meanDeviationH: { type: number, examples: [0.1333] }
        medianDeviationH: { type: number }
        q1DeviationH: { type: number }
        q3DeviationH: { type: number }
        sdDeviationH: { type: [number, 'null'] }
        minDeviationH: { type: number }
        maxDeviationH: { type: number }

    ExportRequest:
      type: object
      properties:
        filters: { $ref: '#/components/schemas/AnalyticsFilter' }
        format:
          type: string
          enum: [full, clean]
          default: full
          description: full preserves the detailed workbook; clean produces the client's 30-column v4 table.
        fishStageAgeDays:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: integer, minimum: 0 }
          description: Required for clean format. Strictly increasing Fry, Juvenile and Adult age milestones in days from birth. Counts require an ALIVE fish observation at or beyond each age; zero means no documented survivors, not confirmed mortality. Ages are included in the download filename. Manual fish without embryo lineage are excluded.
        sheets:
          type: [array, 'null']
          description: Only for full format; omit for all 14 sheets. Clean format always contains the single v4 sheet.
          minItems: 1
          uniqueItems: true
          items: { type: string }
        locale:
          type: string
          enum: [th, en]
          default: th

    AuditEntry:
      type: object
      required: [id, tableName, recordId, action, occurredAt]
      properties:
        id: { type: string, format: uuid }
        tableName: { type: string }
        recordId: { type: string, format: uuid }
        action: { type: string, enum: [INSERT, UPDATE, DELETE] }
        oldValues: { type: [object, 'null'], additionalProperties: true }
        newValues: { type: [object, 'null'], additionalProperties: true }
        operatorId: { type: [string, 'null'], format: uuid }
        operatorName: { type: [string, 'null'] }
        deviceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }

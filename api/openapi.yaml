                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Protocol' }

  /protocols/{id}/stages:
    parameters: [ $ref: '#/components/parameters/PathId' ]
    get:
      tags: [Timing]
      summary: List the checkpoint definitions of a protocol
      description: Returns all 36 stages in order. Stages 1–26 are `STAGE_1`, 27–36 are `STAGE_2`.
      operationId: listProtocolStages
      responses:
        '200':
          description: Stage definitions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StageDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }

  /timing-profiles/current:
    get:
      tags: [Timing]
      summary: Get the reference timing profile currently in effect
      operationId: getCurrentTimingProfile
      parameters:
        - name: protocolId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current profile with one entry per stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimingProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /timing-profiles:
    get:
      tags: [Timing]
      summary: List every version of the reference timing, newest first
      operationId: listTimingProfiles
      parameters:
        - name: protocolId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Profile versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TimingProfile' }
    post:
      tags: [Timing]
      summary: Save edited reference timing as a new version
      description: |
        Saving never overwrites (BR-21). The server copies every stage entry from
        the current version, applies the supplied overrides, stores the result as
        `version + 1`, and marks it current.

        Batches created earlier keep pointing at the version they were created
        with, and `deviation_h` values already stored on observations are never
        recomputed (NFR-203, AC-204). This is what lets the lab adjust the
        reference times freely without silently rewriting past results.
      operationId: createTimingProfileVersion
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocolId, name, entries]
              properties:
                protocolId: { type: string, format: uuid }
                name:
                  type: string
                  maxLength: 200
                  examples: ['Lab-measured 2026-09']
                referenceTempC:
                  type: [number, 'null']
                  description: Recorded for reference. Not applied in v1 (Q-N2, FR-207 is v2).
                  examples: [28.5]
                sourceNote: { type: [string, 'null'], maxLength: 500 }
                entries:
                  type: array
                  minItems: 1
                  description: Only the stages whose value changed need to be listed.
                  items:
                    type: object
                    required: [stageCode, expectedHpa]
                    properties:
                      stageCode: { type: string, examples: ['stage_09_256C'] }
                      expectedHpa: { type: number, minimum: 0, examples: [2.5] }
      responses:
        '201':
          description: New version created and made current
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimingProfile' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /timing-profiles/csv:
    get:
      tags: [Timing]
      summary: Download the current reference timing as CSV
      operationId: exportTimingCsv
      parameters:
        - name: protocolId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: CSV with columns stage_order, stage_code, label, expected_hpa
          content:
            text/csv:
              schema: { type: string }
    post:
      tags: [Timing]
      summary: Upload reference timing as CSV, creating a new version
      operationId: importTimingCsv
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimingProfile' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # --------------------------------------------------------------- experiments
  /batches:
    get:
      tags: [Experiments]
      summary: List experiment batches
      operationId: listBatches
      parameters:
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: operatorId, in: query, schema: { type: string, format: uuid } }
        - { name: experimentGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: treatmentGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: donorCellLineId, in: query, schema: { type: string, format: uuid } }
        - { name: strain, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Batch' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Experiments]
      summary: Create an experiment batch
      description: |
        The server pins the currently-effective timing profile onto the batch at
        creation time (FR-303) and suggests `batchCode` as
        `{dayNo}_{operator}_{treatmentGroup}` when the caller omits it (FR-302).
      operationId: createBatch
      parameters: [ $ref: '#/components/parameters/OperatorId', $ref: '#/components/parameters/DeviceId', $ref: '#/components/parameters/IdempotencyKey' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /batches/{id}:
    parameters: [ $ref: '#/components/parameters/PathId' ]

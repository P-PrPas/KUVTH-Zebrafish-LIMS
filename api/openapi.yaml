openapi: 3.1.0

info:
  title: KUVTH Zebrafish LIMS API
  version: 1.0.0
  summary: Zebrafish somatic cell nuclear transfer embryo and clone-fish tracking
  description: |
    Contract between the static SPA front end and the Go back end.

    This document is the single source of truth for the interface
    (SRS v1.0 section 8, API-02). Generate both sides from it:

      * server stubs — generated directly from this OpenAPI 3.1 document
      * browser client — `openapi-typescript api/openapi.yaml -o frontend/src/api/schema.d.ts`

    ### Conventions

    * All timestamps are RFC 3339 **with an explicit offset** (CI-04).
      The server stores UTC; the client sends and displays `Asia/Bangkok`.
    * All hour values are decimal hours with 4 decimal places (DR-05).
    * Writes carry `X-Operator-Id` and `X-Device-Id` (API-03) because the
      system has no login (CON-01) and still has to record who did what.
    * Every mutation also accepts `X-Idempotency-Key`. Clients persist this
      stable key with the queued write; retries return the original result.
    * Bulk write endpoints are idempotent on `clientUuid` (BR-18). Re-sending
      is always safe and is the normal case, not an error — the offline write
      queue retries freely.
    * JSON fields use `camelCase`; SQL columns and tabular exports use
      `snake_case`.
    * The server computes authoritative `hpaActual`, `hpaExpected`, and
      `deviationH`. The client may calculate a live preview only (DC-05).
  contact:
    name: KUVTH Zebrafish LIMS
  license:
    name: Proprietary

servers:
  - url: https://{host}/api/v1
    description: Deployment target is not yet decided (SRS 9.2); host is configurable
    variables:
      host:
        default: localhost:8080

tags:
  - name: Master data
    description: Sites, operators, strains, lots, treatment groups, boxes (FR-100)
  - name: Timing
    description: Protocol stages and reference timing profiles (FR-200)
  - name: Experiments
    description: Batches, injection lots, embryos (FR-300)
  - name: Observations
    description: Recording survival at checkpoints and daily roll-call (FR-400, FR-600)
  - name: Promotion
    description: Moving surviving embryos into the fish register (FR-500)
  - name: Fish
    description: Clone fish register and specimens (FR-600)
  - name: Analytics
    description: Dashboard aggregates (FR-800)
  - name: Export
    description: Excel and R-ready output (FR-900)
  - name: Audit
    description: Change history (FR-1100)


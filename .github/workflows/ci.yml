name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install backend
        run: python -m pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Lint and test backend
        working-directory: backend
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m pytest --cov=chronofish.domain --cov=chronofish.services --cov-report=term-missing --cov-fail-under=90
      - name: Check source encoding
        run: python scripts/check_source_encoding.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
          npm test -- --coverage
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config
          docker compose -f compose.mysql.yaml --profile mysql config
      - name: Build production API image
        run: |
          docker build \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            -f backend/Dockerfile -t kuvth-zebrafish-lims-api:ci .
      - name: Verify production image metadata and user
        run: |
          test "$(docker image inspect kuvth-zebrafish-lims-api:ci --format '{{.Config.User}}')" = "chronofish"
          test "$(docker image inspect kuvth-zebrafish-lims-api:ci --format '{{index .Config.Labels "org.opencontainers.image.title"}}')" = "KUVTH Zebrafish LIMS API"
          test "$(docker image inspect kuvth-zebrafish-lims-api:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect kuvth-zebrafish-lims-api:ci --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" != "unknown"
      - name: Build production frontend image
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 --build-arg VCS_REF="$GITHUB_SHA" -f frontend/Dockerfile -t kuvth-zebrafish-lims-frontend:ci frontend
      - name: Verify frontend image metadata and user
        run: |
          test "$(docker image inspect kuvth-zebrafish-lims-frontend:ci --format '{{.Config.User}}')" = "nginx"
          test "$(docker image inspect kuvth-zebrafish-lims-frontend:ci --format '{{index .Config.Labels "org.opencontainers.image.title"}}')" = "KUVTH Zebrafish LIMS frontend"
          test "$(docker image inspect kuvth-zebrafish-lims-frontend:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
      - name: Smoke test Compose frontend proxies
        run: |
          trap 'docker compose -f compose.yaml logs --no-color || true; docker compose -f compose.mysql.yaml --profile mysql logs --no-color || true' ERR
          trap 'docker compose -f compose.yaml down -v; docker compose -f compose.mysql.yaml --profile mysql down -v' EXIT
          docker compose -f compose.yaml up --build --wait --wait-timeout 120
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/api/v1/health
          docker compose -f compose.yaml down -v
          docker compose -f compose.mysql.yaml --profile mysql up --build --wait --wait-timeout 120
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/api/v1/health

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_openapi.py
      - name: Verify generated MySQL migrations
        run: |
          python scripts/gen_mysql_migrations.py
          git diff --exit-code -- backend/db/migrations/mysql

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chronofish
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chronofish"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DB_DRIVER: postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chronofish
      MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/postgres
      CHRONOFISH_TEST_DATABASE_DRIVER: postgres
      CHRONOFISH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chronofish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - run: python -m pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Run PostgreSQL integration suite
        working-directory: backend
        run: python -m pytest tests/test_sql_integration.py
      - name: Boot API and verify health
        working-directory: backend
        run: |
          python -m chronofish >/tmp/chronofish-postgres.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8080/api/v1/health && exit 0 || sleep 2; done
          cat /tmp/chronofish-postgres.log
          exit 1
      - name: Test constraints and idempotent seed
        run: |
          psql "postgres://postgres:postgres@localhost:5432/chronofish" -v ON_ERROR_STOP=1 -f backend/db/tests/postgres/constraint_checks.sql
          psql "postgres://postgres:postgres@localhost:5432/chronofish" -v ON_ERROR_STOP=1 -f backend/db/seeds/postgres/master_data.sql
          psql "postgres://postgres:postgres@localhost:5432/chronofish" -v ON_ERROR_STOP=1 -f backend/db/seeds/postgres/master_data.sql

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chronofish
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/chronofish
      MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/mysql
      CHRONOFISH_TEST_DATABASE_DRIVER: mysql
      CHRONOFISH_TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/chronofish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - run: python -m pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Run MySQL integration suite
        working-directory: backend
        run: python -m pytest tests/test_sql_integration.py
      - name: Boot API and verify health
        working-directory: backend
        run: |
          python -m chronofish >/tmp/chronofish-mysql.log 2>&1 &
          for i in {1..45}; do curl --fail --silent http://127.0.0.1:8080/api/v1/health && exit 0 || sleep 2; done
          cat /tmp/chronofish-mysql.log
          exit 1
      - name: Test constraints and idempotent seed
        run: |
          mysql -h 127.0.0.1 -uroot -proot chronofish < backend/db/tests/mysql/constraint_checks.sql
          mysql -h 127.0.0.1 -uroot -proot chronofish < backend/db/seeds/mysql/master_data.sql
          mysql -h 127.0.0.1 -uroot -proot chronofish < backend/db/seeds/mysql/master_data.sql
